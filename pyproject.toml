[project]
name = "machine-failure-prediction"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "numpy<=2.4",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap",
    "xgboost>=3.4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]